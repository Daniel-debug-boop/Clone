name: Build Custom Monolithic Godot Engine

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential scons pkg-config libx11-dev             libxcursor-dev libxinerama-dev libgl1-mesa-dev libglu1-mesa-dev             libasound2-dev libpulse-dev libudev-dev libxi-dev libxrandr-dev             libwayland-dev zstd libzstd-dev git-lfs

      - name: Clone Godot Engine & All 19 Modules Fresh
        run: |
          mkdir -p modules
          cd modules
          
          echo "Cloning Godot Core..."
          git clone --recursive https://github.com/NVIDIA-RTX/godot.git godot-engine
          
          echo "Cloning Modules..."
          git clone --recursive https://github.com/godot-jolt/godot-jolt.git jolt_physics
          git clone --recursive https://github.com/NVIDIA-RTX/RTXDI.git RTXDI
          git clone --recursive https://github.com/NVIDIA-RTX/NRD.git NRD
          git clone --recursive https://github.com/zeux/meshoptimizer.git meshoptimizer
          git clone --recursive https://github.com/CesiumGS/cesium-godot.git cesium
          git clone --recursive https://github.com/TokisanGames/Terrain3D.git terrain_3d
          git clone --recursive https://github.com/TheDuckCow/godot-road-generator.git godot-road-generator
          git clone --recursive https://github.com/HungryProton/scatter.git scatter
          git clone --recursive https://github.com/gboeing/osmnx.git osmnx
          git clone --recursive https://github.com/ValveSoftware/steam-audio.git steam_audio
          git clone --recursive https://github.com/recastnavigation/recastnavigation.git recastnavigation
          git clone --recursive https://github.com/limboai/limboai.git limbo_ai
          git clone --recursive https://github.com/limboai/godot-debug-draw-3d.git DebugDraw3D
          git clone --recursive https://github.com/2shady4you/godot-sqlite.git godot_sqlite
          git clone --recursive https://github.com/RaidTheory/Godot-Mixamo-Animation-Retargeter.git Godot-Mixamo-Animation-Retargeter
          git clone --recursive https://github.com/gdquest-demos/godot-4-3d-third-person-controller.git godot-4-3d-third-person-controller
          git clone --recursive https://github.com/nathanhoad/godot_dialogue_manager.git godot_dialogue_manager
          git clone --recursive https://github.com/gluttony/Gloot.git Gloot

      - name: Link Modules into Godot Source Tree
        run: |
          cd modules/godot-engine/modules
          ln -s ../jolt_physics jolt_physics
          ln -s ../cesium cesium
          ln -s ../meshoptimizer meshoptimizer
          ln -s ../terrain_3d terrain_3d
          ln -s ../steam_audio steam_audio
          ln -s ../limbo_ai limbo_ai
          ln -s ../godot_sqlite godot_sqlite

      - name: Set up SCons Cache
        uses: actions/cache@v4
        with:
          path: .scons-cache
          key: ${{ runner.os }}-scons-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-scons-

      - name: Compile Monolithic Engine
        env:
          SCONS_CACHE: ${{ github.workspace }}.scons-cache
        run: |
          cd modules/godot-engine
          scons platform=linuxbsd target=editor arch=x86_64 precision=double use_lto=yes use_static_cpp=yes -j$(nproc)

      - name: Upload Compiled Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-godot-editor-linux
          path: modules/godot-engine/bin/godot.linuxbsd.editor.double.x86_64
