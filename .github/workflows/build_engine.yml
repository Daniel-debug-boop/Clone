name: Build Custom Monolithic Godot Engine

# Manual only: this compiles a whole Godot engine (~1-3h) on every run.
on:
  workflow_dispatch:
    inputs:
      engine_ref:
        description: "Engine git ref to build (empty = repository default branch)"
        required: false
        default: ""
        type: string
      link_modules:
        description: "Manifest keys of modules to link (comma separated, empty = engine-only baseline)"
        required: false
        default: ""
        type: string
      lto:
        description: "Link-time optimization for the optimized build"
        required: false
        default: full
        type: choice
        options:
          - none
          - thin
          - full
      run_startup_test:
        description: "Run the built binary's headless startup check"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: "build-engine-${{ github.ref }}"
  cancel-in-progress: true

env:
  ENGINE_KEY: godot-engine
  ENGINE_DIR: ${{ github.workspace }}/modules/godot-engine
  # SCons cache directory. MUST stay in sync with the actions/cache `path` below.
  # `SCONS_CACHE` is the deprecated fallback; the engine prefers the `cache_path`
  # SCons argument, so both are passed to the same directory.
  SCONS_CACHE: ${{ github.workspace }}/.scons-cache

jobs:
  build:
    name: Monolithic editor (linuxbsd, double)
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # This repository tracks 14 gitlinks under modules/ but has NO .gitmodules,
          # so `git submodule update --init` fails with "no submodule mapping found".
          # Engine and module sources are cloned explicitly in the next step instead.
          submodules: false
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential scons pkg-config python3 \
            libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            libasound2-dev libpulse-dev \
            libudev-dev libdbus-1-dev libfontconfig1-dev \
            libwayland-dev libdecor-0-dev libspeechd-dev \
            libzstd-dev
          echo "--- toolchain ---"
          scons --version | head -5
          gcc --version | head -1

      - name: Restore SCons cache
        uses: actions/cache@v4
        with:
          path: .scons-cache
          # run_id keeps the key unique so an updated cache is always saved;
          # restore-keys pick up the most recent one for this branch.
          key: scons-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('.github/scripts/modules.manifest.tsv') }}-${{ github.run_id }}
          restore-keys: |
            scons-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('.github/scripts/modules.manifest.tsv') }}-
            scons-${{ runner.os }}-${{ github.ref_name }}-
            scons-${{ runner.os }}-

      - name: Plan integration
        env:
          WORKSPACE: ${{ github.workspace }}
        run: bash .github/scripts/integrate_engine_modules.sh plan

      - name: Check required repositories are reachable
        env:
          WORKSPACE: ${{ github.workspace }}
          ENGINE_REF: ${{ inputs.engine_ref }}
          LINK_MODULES: ${{ inputs.link_modules }}
        run: bash .github/scripts/integrate_engine_modules.sh check-remote

      - name: Fetch engine and module sources
        env:
          WORKSPACE: ${{ github.workspace }}
          ENGINE_REF: ${{ inputs.engine_ref }}
          LINK_MODULES: ${{ inputs.link_modules }}
        run: bash .github/scripts/integrate_engine_modules.sh fetch

      - name: Validate sources, module registration and duplicates
        env:
          WORKSPACE: ${{ github.workspace }}
          ENGINE_REF: ${{ inputs.engine_ref }}
          LINK_MODULES: ${{ inputs.link_modules }}
        run: bash .github/scripts/integrate_engine_modules.sh validate

      - name: Link modules into the engine source tree
        env:
          WORKSPACE: ${{ github.workspace }}
          ENGINE_REF: ${{ inputs.engine_ref }}
          LINK_MODULES: ${{ inputs.link_modules }}
        run: |
          bash .github/scripts/integrate_engine_modules.sh link
          echo "--- engine modules/ ---"
          ls -la "$ENGINE_DIR/modules" | tail -20

      # Step 8a: baseline build, default options only. This is the integration
      # smoke test: if it fails, the failure is in the sources, not in LTO.
      - name: Compile engine (baseline)
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache
        run: |
          set -euo pipefail
          cd "$ENGINE_DIR"
          scons \
            platform=linuxbsd target=editor arch=x86_64 precision=double \
            cache_path="$SCONS_CACHE" redirect_build_objects=no \
            -j"$(nproc)"

      # Step 8b: optimized build. `lto=` is the engine's option (there is no
      # `use_lto` in this engine); `use_static_cpp` defaults to yes on linuxbsd.
      - name: "Compile engine (optimized: LTO + static C++)"
        if: ${{ inputs.lto != 'none' }}
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache
        run: |
          set -euo pipefail
          cd "$ENGINE_DIR"
          scons \
            platform=linuxbsd target=editor arch=x86_64 precision=double \
            lto=${{ inputs.lto }} use_static_cpp=yes \
            cache_path="$SCONS_CACHE" redirect_build_objects=no \
            -j"$(nproc)"

      # Step 9: prove the artifact is real before publishing it.
      - name: Verify executable
        id: verify
        env:
          RUN_STARTUP_TEST: ${{ inputs.run_startup_test }}
        run: |
          bash .github/scripts/verify_engine_binary.sh "$ENGINE_DIR" 'godot.linuxbsd.editor*'

      - name: Upload compiled binary
        uses: actions/upload-artifact@v4
        with:
          name: custom-godot-editor-linux
          path: ${{ steps.verify.outputs.binary }}
          if-no-files-found: error
          retention-days: 14
